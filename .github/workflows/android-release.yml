name: Eta Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    name: 构建 Debug 与 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 准备发布证书
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" ||
                -z "$ETA_RELEASE_STORE_PASSWORD" ||
                -z "$ETA_RELEASE_KEY_ALIAS" ||
                -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::缺少 Release 签名 Secrets；必须使用配置的发布证书，不生成临时证书。"
            exit 1
          fi
          umask 077
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/eta-release.jks"
          keytool -exportcert -keystore "$RUNNER_TEMP/eta-release.jks" \
            -alias "$ETA_RELEASE_KEY_ALIAS" -storepass:env ETA_RELEASE_STORE_PASSWORD \
            -file "$RUNNER_TEMP/eta-release.der"
          sha256sum "$RUNNER_TEMP/eta-release.der" | cut -d ' ' -f 1 > "$RUNNER_TEMP/eta-release.sha256"

      - name: 工作屏与后台执行回归测试
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:testDebugUnitTest
          --tests 'io.github.mangi.eta.agent.display.*'
          --tests 'io.github.mangi.eta.agent.runtime.ExecutionLeaseRegistryTest'
          --tests 'io.github.mangi.eta.agent.runtime.ExecutionStopQueueTest'
          --tests 'io.github.mangi.eta.agent.runtime.AgentRuntimeWireTest'

      - name: 上传工作屏测试报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: work-display-tests
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: 构建 Debug 与 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:assembleDebug :app:assembleRelease

      - name: 验证并整理 APK
        id: apk
        run: |
          set -euo pipefail
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release.apk"
          output_dir="$RUNNER_TEMP/apks"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ! -f "$debug_apk" ]]; then
            echo "::error::未找到 Debug APK。"
            exit 1
          fi
          if [[ ! -f "$release_apk" ]]; then
            echo "::error::未找到 Release APK。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          "$apksigner_path" verify --print-certs "$release_apk" | tee "$RUNNER_TEMP/eta-apk-signature.txt"
          expected_digest="$(cat "$RUNNER_TEMP/eta-release.sha256")"
          actual_digest="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/eta-apk-signature.txt" | tr '[:upper:]' '[:lower:]' | sort -u)"
          if [[ "$actual_digest" != "$expected_digest" ]]; then
            echo "::error::Release APK 签名与配置的发布证书不一致。"
            exit 1
          fi
          mkdir -p "$output_dir"
          cp "$debug_apk" "$output_dir/app-debug.apk"
          cp "$release_apk" "$output_dir/app-release.apk"
          echo "debug_path=$output_dir/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "release_path=$output_dir/app-release.apk" >> "$GITHUB_OUTPUT"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-debug
          path: ${{ steps.apk.outputs.debug_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-release
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
